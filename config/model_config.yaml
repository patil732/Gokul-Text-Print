# ============================================================
# Model Configuration File
# Defines algorithm choice, hyperparameter profiles for all
# supported algorithms (random_forest, xgboost, lightgbm),
# scaler settings, and feature contracts for ML pipelines.
# ============================================================

# ------------------------------------------------------------
# Sales Forecasting Pipeline Configuration
# ------------------------------------------------------------
sales:
  # Active algorithm. Options: xgboost | lightgbm | random_forest
  # XGBoost selected as best algorithm for tabular sales forecasting
  algorithm: xgboost

  # Hyperparameter profiles per supported algorithm
  algorithms:
    xgboost:
      n_estimators: 250
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      n_jobs: -1
      eval_metric: logloss

    lightgbm:
      n_estimators: 250
      max_depth: 8
      learning_rate: 0.05
      num_leaves: 31
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      n_jobs: -1
      verbose: -1

    random_forest:
      n_estimators: 200
      max_depth: 10
      random_state: 42
      n_jobs: -1

  scaler:
    enabled: true
    type: standard          # Options: standard | minmax | robust

  features:
    - sales
    - sales_lag_1
    - sales_lag_2
    - sales_lag_3
    - sales_ma_3
    - sales_ma_7
    - sales_ma_14
    - sales_std_7
    - momentum
    - trend
    - stock_ratio

  target: target_decision


# ------------------------------------------------------------
# Inventory Reorder Prediction Pipeline Configuration
# ------------------------------------------------------------
inventory:
  # Active algorithm. Options: lightgbm | xgboost | random_forest
  # LightGBM selected as best algorithm for imbalanced inventory reorder classification
  algorithm: lightgbm

  # Hyperparameter profiles per supported algorithm
  algorithms:
    lightgbm:
      n_estimators: 300
      max_depth: 8
      learning_rate: 0.03
      num_leaves: 31
      is_unbalance: true
      random_state: 42
      n_jobs: -1
      verbose: -1

    xgboost:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.03
      scale_pos_weight: 1.0
      random_state: 42
      n_jobs: -1
      eval_metric: logloss

    random_forest:
      n_estimators: 300
      max_depth: 8
      class_weight: balanced
      random_state: 42
      n_jobs: -1

  scaler:
    enabled: true
    type: minmax            # Options: standard | minmax | robust

  features:
    - total_stock
    - warehouse_count
    - avg_stock_per_wh
    - max_stock_in_wh
    - stock_concentration
    - total_qty_planned
    - total_produced
    - production_gap
    - fulfillment_rate
    - has_open_orders

  target: reorder_flag
