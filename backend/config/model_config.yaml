sales:
  algorithm: xgboost
  algorithms:
    xgboost:
      n_estimators: 250
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      n_jobs: -1
      eval_metric: logloss
    lightgbm:
      n_estimators: 250
      max_depth: 8
      learning_rate: 0.05
      num_leaves: 31
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      n_jobs: -1
      verbose: -1
    random_forest:
      n_estimators: 200
      max_depth: 10
      random_state: 42
      n_jobs: -1
    gradient_boosting:
      n_estimators: 150
      max_depth: 5
      learning_rate: 0.1
      subsample: 0.8
      random_state: 42
  tuning:
    strategy: random
    n_iter: 8
    cv: 3
    scoring: neg_root_mean_squared_error
    random_forest:
      n_estimators:
      - 100
      - 200
      max_depth:
      - 5
      - 10
      - null
      min_samples_split:
      - 2
      - 5
    xgboost:
      n_estimators:
      - 100
      - 200
      max_depth:
      - 4
      - 6
      learning_rate:
      - 0.05
      - 0.1
      subsample:
      - 0.7
      - 0.9
    lightgbm:
      n_estimators:
      - 100
      - 200
      num_leaves:
      - 31
      - 63
      learning_rate:
      - 0.05
      - 0.1
      subsample:
      - 0.7
      - 0.9
    gradient_boosting:
      n_estimators:
      - 100
      - 150
      max_depth:
      - 3
      - 5
      learning_rate:
      - 0.05
      - 0.1
      subsample:
      - 0.7
      - 0.9
  scaler:
    enabled: true
    type: standard
  features:
  - sales
  - sales_lag_1
  - sales_lag_2
  - sales_lag_3
  - sales_ma_3
  - sales_ma_7
  - sales_ma_14
  - sales_std_7
  - momentum
  - trend
  - stock_ratio
  target: target_decision
inventory:
  algorithm: xgboost
  algorithms:
    lightgbm:
      n_estimators: 300
      max_depth: 8
      learning_rate: 0.03
      num_leaves: 31
      is_unbalance: true
      random_state: 42
      n_jobs: -1
      verbose: -1
    xgboost:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.03
      scale_pos_weight: 1.0
      random_state: 42
      n_jobs: -1
      eval_metric: logloss
    random_forest:
      n_estimators: 300
      max_depth: 8
      class_weight: balanced
      random_state: 42
      n_jobs: -1
  scaler:
    enabled: true
    type: minmax
  features:
  - total_stock
  - warehouse_count
  - avg_stock_per_wh
  - max_stock_in_wh
  - stock_concentration
  - total_qty_planned
  - total_produced
  - production_gap
  - fulfillment_rate
  - has_open_orders
  - available_qty
  - safety_stock
  - stock_turnover
  - days_in_inventory
  - fast_moving
  - slow_moving
  - dead_stock
  - reorder_level
  target: reorder_flag
rag:
  embedding:
    provider: sentence_transformers
    batch_size: 32
  providers:
    sentence_transformers:
      model: all-MiniLM-L6-v2
      dimension: 384
    openai:
      model: text-embedding-3-small
      dimension: 1536
      api_key_env: OPENAI_API_KEY
    gemini:
      model: models/text-embedding-004
      dimension: 768
      api_key_env: GEMINI_API_KEY
  search:
    default_top_k: 5
    max_top_k: 50
    index_type: FlatIP
    nprobe: 10
    cache_ttl_seconds: 300
  chat:
    provider: gemini
    top_k: 5
    max_tokens: 1024
    temperature: 0.2
  chat_providers:
    gemini:
      model: gemini-2.5-flash
      api_key_env: GEMINI_API_KEY
    openai:
      model: gpt-4o-mini
      api_key_env: OPENAI_API_KEY
