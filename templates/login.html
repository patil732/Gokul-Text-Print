<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Gokul Tex Print</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-light); 
            width: 100%; 
            max-width: 420px; 
            padding: 3rem; 
            border-radius: 1.5rem; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.05); 
        }
        .form-control { 
            background-color: #f9fafb; 
            border: 1px solid var(--border-light); 
            color: var(--text-primary); 
            border-radius: 0.75rem; 
            padding: 0.8rem 1rem; 
        }
        .form-control:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 4px rgba(93, 124, 59, 0.1); 
        }
        .btn-primary { 
            background-color: var(--primary); 
            border: none; 
            padding: 0.8rem; 
            border-radius: 0.75rem; 
            font-weight: 700; 
            color: #ffffff !important;
        }
        .btn-primary:hover { background-color: var(--primary-dark); transform: translateY(-1px); }
        .logo { font-weight: 800; font-size: 1.75rem; background: linear-gradient(to right, var(--primary), #d4af37); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="logo mb-2">GOKUL TEX PRINT</div>
            <p class="text-secondary small">Intelligent Textile Solutions | Est. 1993</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category if category != 'danger' else 'warning' }} border-0 small shadow-sm">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label small text-secondary fw-bold">USERNAME</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label small text-secondary fw-bold">PASSWORD</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In to Dashboard</button>
        </form>
        <div class="text-center mt-4">
            <p class="small text-secondary">New to the platform? <a href="{{ url_for('auth.register') }}" class="text-primary text-decoration-none">Create account</a></p>
        </div>
    </div>
</body>
</html>
